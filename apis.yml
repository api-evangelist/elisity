aid: elisity
name: Elisity
description: >-
  Elisity is a San Jose-based cybersecurity company (founded 2019, backed by Insight
  Partners) that builds an AI-powered, identity-based microsegmentation platform for
  Zero Trust security. Elisity discovers, classifies, and continuously monitors every
  user, workload, and device, then enforces dynamic least-privilege policies to stop
  lateral movement, without agents, new hardware, or network changes, by leveraging the
  Cisco, Arista, and Juniper switches organizations already own. The platform centers on
  Elisity IdentityGraph (real-time asset visibility enriched from sources like Active
  Directory, CrowdStrike, and Armis), a Dynamic Policy Engine, lightweight Virtual Edge
  container software that syncs policy to existing infrastructure, and the Cloud Control
  Center admin portal. Its product API and Open Connector integration API are documented
  inside the authenticated Cloud Control Center rather than a public developer portal.
  Elisity is used by Fortune 500 healthcare systems, manufacturers, and pharmaceutical
  firms for IoMT, OT/ICS, and enterprise segmentation.
